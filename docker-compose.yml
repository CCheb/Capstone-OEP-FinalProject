version: "3.8"

services:

  appsmith:
    image: index.docker.io/appsmith/appsmith-ce
    container_name: appsmith
    ports:
      - "8080:80"
    volumes:
      - ./stacks:/appsmith-stacks
    restart: unless-stopped
    depends_on:
      - arangodb
  
  upload-api:
    image: node:20
    container_name: upload-api
    working_dir: /app
    volumes:
      - ./upload-api:/app
      - ./data:/uploads
    command: sh -c "npm init -y && npm install express multer && node server.js" # This will run off rip
    ports:
      - "5055:3000"
    restart: unless-stopped

  server:
    image: "orlando-server:1.0.0"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      DATABASE__CONNECTIONSTRING: "Server=http://arangodb:8529;"
      REST__JWT__AUDIENCE: "http://localhost:5000"
      REST__JWT__ISSUER: "http://localhost:5000"
      REST__JWT__SECRETKEY: "your-secret-key"
      REST__SWAGGER__ENABLED: "true"
    ports:
      - "5050:5000"
      - "5001:5001"
    volumes:
      - "./data:/var/lib/server/data"
      - "server_hangfire:/var/lib/server/hangfire"
      - "server_media:/var/lib/server/media"
    depends_on:
      - arangodb
    restart: always

  arangodb:
    image: "arangodb:3.8.3"
    platform: "linux/amd64"
    environment:
      ARANGO_NO_AUTH: "1"
    ports:
      - "8529:8529"
    volumes:
      - "arangodb_app:/var/lib/arangodb3-apps"
      - "arangodb_data:/var/lib/arangodb3"
    restart: always

volumes:
  arangodb_app:
  arangodb_data:
  server_hangfire:
  server_media: